{% extends 'base.html' %}
{% block title %}Meeting — CCRM{% endblock %}
{% block content %}
<div id="meetingDetailRoot">
  <p class="empty-state">Loading…</p>
</div>

<!-- Attendees section -->
<div id="attendeesSection" style="display:none">
  <div class="card">
    <div class="section-header">
      <div class="card-title" style="margin:0">Attendees</div>
    </div>
    <div id="attendeesAddRow" style="display:flex;gap:8px;margin-bottom:12px">
      <select id="attendeeSelect" style="flex:1">
        <option value="">— Add attendee —</option>
      </select>
      <button class="btn btn-primary btn-sm" onclick="addAttendee()">Add</button>
    </div>
    <div id="attendeesList"></div>
  </div>
</div>

<!-- Action Items section -->
<div id="actionItemsSection" style="display:none">
  <div class="card">
    <div class="section-header">
      <div class="card-title" style="margin:0">Action Items</div>
      <button class="btn btn-primary btn-sm" onclick="openAddActionItem()">+ Add</button>
    </div>
    <div id="actionItemsList"></div>
  </div>
</div>

<!-- Edit Meeting Modal -->
<div class="modal" id="meetingModal">
  <div class="modal-title" id="meetingModalTitle">Edit Meeting</div>
  <form id="meetingForm" onsubmit="submitMeetingDetail(event)">
    <input type="hidden" id="meetingId">
    <div class="form-row"><label>Title *</label><input type="text" id="mTitle" required></div>
    <div class="form-row-2">
      <div class="form-row"><label>Date *</label><input type="date" id="mDate" required></div>
      <div class="form-row">
        <label>Company</label>
        <select id="mCompanyId">
          <option value="">— None —</option>
        </select>
      </div>
    </div>
    <div class="form-row"><label>Notes</label><textarea id="mNotes"></textarea></div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</div>

<!-- Add/Edit Action Item Modal -->
<div class="modal" id="actionItemModal">
  <div class="modal-title" id="actionItemModalTitle">Add Action Item</div>
  <form id="actionItemForm" onsubmit="submitActionItem(event)">
    <input type="hidden" id="actionItemId">
    <div class="form-row"><label>Description *</label><textarea id="aiDescription" required placeholder="What needs to be done?"></textarea></div>
    <div class="form-row-2">
      <div class="form-row"><label>Due Date</label><input type="date" id="aiDueDate"></div>
      <div class="form-row">
        <label>Assigned To</label>
        <select id="aiAssignedTo">
          <option value="">— Unassigned —</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</div>
{% endblock %}
{% block scripts %}
<script>
  initMeetingDetail({{ meeting_id }});
  document.getElementById('attendeesSection').style.display = '';
  document.getElementById('actionItemsSection').style.display = '';
</script>
{% endblock %}
