{% extends 'base.html' %}
{% block title %}New Meeting — TAM Debrief{% endblock %}
{% block content %}
<a href="/meetings" class="back-link">← All Meetings</a>
<div class="page-header">
  <h1 class="page-title">New Meeting</h1>
</div>
<div class="card">
  <form id="newMeetingForm" onsubmit="saveNewMeeting(event)">
    <div class="form-row">
      <label>Title *</label>
      <input type="text" id="mTitle" required placeholder="Meeting title">
    </div>
    <div class="form-row-2">
      <div class="form-row">
        <label>Date *</label>
        <input type="date" id="mDate" required>
      </div>
      <div class="form-row">
        <label>Company</label>
        <select id="mCompanyId">
          <option value="">— None —</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <label>Notes</label>
      <textarea id="mNotes" style="min-height:160px" placeholder="Meeting notes…"></textarea>
    </div>
    <div class="modal-footer">
      <a href="/meetings" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary">Save Meeting</button>
    </div>
  </form>
</div>
{% endblock %}
{% block scripts %}<script>initNewMeeting();</script>{% endblock %}
