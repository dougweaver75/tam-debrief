{% extends 'base.html' %}
{% block title %}Meetings — CCRM{% endblock %}
{% block content %}
<div class="page-header">
  <h1 class="page-title">Meetings</h1>
  <button class="btn btn-primary" onclick="openAddMeeting()">+ Add Meeting</button>
</div>

<div class="card" style="padding:16px 20px">
  <div class="table-wrap">
    <table id="meetingsTable">
      <thead>
        <tr>
          <th>Title</th>
          <th>Date</th>
          <th>Company</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="meetingsBody">
        <tr><td colspan="4" class="empty-state">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Add/Edit Meeting Modal -->
<div class="modal" id="meetingModal">
  <div class="modal-title" id="meetingModalTitle">Add Meeting</div>
  <form id="meetingForm" onsubmit="submitMeeting(event)">
    <input type="hidden" id="meetingId">
    <div class="form-row"><label>Title *</label><input type="text" id="mTitle" required></div>
    <div class="form-row-2">
      <div class="form-row"><label>Date *</label><input type="date" id="mDate" required></div>
      <div class="form-row">
        <label>Company</label>
        <select id="mCompanyId">
          <option value="">— None —</option>
        </select>
      </div>
    </div>
    <div class="form-row"><label>Notes</label><textarea id="mNotes"></textarea></div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</div>
{% endblock %}
{% block scripts %}<script>initMeetings();</script>{% endblock %}
