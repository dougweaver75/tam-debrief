{% extends 'base.html' %}
{% block title %}Company — TAM Debrief{% endblock %}
{% block content %}
<div id="companyDetailRoot">
  <p class="empty-state">Loading…</p>
</div>

<div id="companyNotesSection" style="display:none">
  <div class="card">
    <div class="section-header">
      <div class="card-title" style="margin:0">Notes</div>
      <button class="btn btn-primary btn-sm" onclick="openAddCompanyNote()">+ Add Note</button>
    </div>
    <div id="companyNotesList"></div>
  </div>
</div>

<div id="companyTimelineSection" style="display:none">
  <div class="card">
    <div class="section-header">
      <div class="card-title" style="margin:0">Timeline</div>
      <button class="btn btn-primary btn-sm" onclick="openAddTimelineEvent()">+ Add Event</button>
    </div>
    <div id="companyTimelineList"></div>
  </div>
</div>

<div id="companyContactsSection" style="display:none">
  <div class="card">
    <div class="card-title">Contacts</div>
    <div id="companyContactsList"></div>
  </div>
</div>

<div class="dash-row">
  <div id="companyMeetingsSection" class="dash-col-half" style="display:none">
    <div class="card">
      <div class="card-title">Meetings</div>
      <div id="companyMeetingsList"></div>
    </div>
  </div>
  <div id="companyActionItemsSection" class="dash-col-half" style="display:none">
    <div class="card">
      <div class="card-title">Action Items</div>
      <div id="companyActionItemsList"></div>
    </div>
  </div>
</div>

<!-- Edit Company Modal -->
<div class="modal" id="companyModal">
  <div class="modal-title" id="companyModalTitle">Edit Company</div>
  <form id="companyForm" onsubmit="submitCompanyDetail(event)">
    <input type="hidden" id="companyId">
    <div class="form-row"><label>Name *</label><input type="text" id="coName" required></div>
    <div class="form-row-2">
      <div class="form-row"><label>Industry</label><input type="text" id="coIndustry"></div>
      <div class="form-row"><label>Website</label><input type="url" id="coWebsite" placeholder="https://"></div>
    </div>
    <div class="form-row"><label>Address</label><input type="text" id="coAddress"></div>
    <div class="form-row">
      <label>Logo</label>
      <div class="logo-edit">
        <img id="coLogoPreview" class="logo-preview" alt="" hidden>
        <span id="coLogoPlaceholder" class="logo-preview logo-preview-empty">No logo</span>
        <input type="file" id="coLogo" accept="image/png,image/jpeg,image/svg+xml,image/webp">
        <button type="button" class="btn btn-secondary btn-sm" id="coLogoRemove">Remove</button>
      </div>
    </div>
    <div class="form-row"><label>Notes</label><textarea id="coNotes"></textarea></div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</div>
<!-- Company Note Modal -->
<div class="modal" id="companyNoteModal">
  <div class="modal-title" id="companyNoteModalTitle">Add Note</div>
  <form id="companyNoteForm" onsubmit="submitCompanyNote(event)">
    <input type="hidden" id="cnId">
    <div class="form-row"><label>Note *</label><textarea id="cnBody" required></textarea></div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</div>
<!-- Timeline Event Modal -->
<div class="modal" id="timelineEventModal">
  <div class="modal-title" id="timelineEventModalTitle">Add Event</div>
  <form id="timelineEventForm" onsubmit="submitTimelineEvent(event)">
    <input type="hidden" id="teId">
    <div class="form-row-2">
      <div class="form-row">
        <label>Category</label>
        <select id="teCategory">
          <option value="milestone">Milestone</option>
          <option value="renewal">Renewal</option>
          <option value="go-live">Go Live</option>
          <option value="risk">Risk</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="form-row"><label>Date *</label><input type="date" id="teDate" required></div>
    </div>
    <div class="form-row"><label>Title *</label><input type="text" id="teTitle" required></div>
    <div class="form-row"><label>Description</label><textarea id="teDescription"></textarea></div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</div>
{% endblock %}
{% block scripts %}
<script>
  initCompanyDetail({{ company_id }});
  document.getElementById('companyNotesSection').style.display = '';
  document.getElementById('companyTimelineSection').style.display = '';
  document.getElementById('companyContactsSection').style.display = '';
  document.getElementById('companyMeetingsSection').style.display = '';
  document.getElementById('companyActionItemsSection').style.display = '';
</script>
{% endblock %}
