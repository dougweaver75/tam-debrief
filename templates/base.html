<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}TAM Debrief{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="brand-text">TAM Debrief</span>
      <button class="sidebar-toggle" onclick="toggleSidebar()" title="Toggle menu">
        <span class="material-icons-round">chevron_left</span>
      </button>
    </div>
    <ul class="sidebar-nav">
      <li>
        <a href="/dashboard" title="Dashboard"
           class="nav-link {% if request.path == '/dashboard' %}active{% endif %}">
          <span class="material-icons-round nav-icon">dashboard</span>
          <span class="nav-label">Dashboard</span>
        </a>
      </li>
      <li>
        <a href="/contacts" title="Contacts"
           class="nav-link {% if request.path.startswith('/contacts') %}active{% endif %}">
          <span class="material-icons-round nav-icon">people</span>
          <span class="nav-label">Contacts</span>
        </a>
      </li>
      <li>
        <a href="/companies" title="Companies"
           class="nav-link {% if request.path.startswith('/companies') %}active{% endif %}">
          <span class="material-icons-round nav-icon">business</span>
          <span class="nav-label">Companies</span>
        </a>
      </li>
      <li>
        <a href="/account-teams" title="Account Teams"
           class="nav-link {% if request.path.startswith('/account-teams') %}active{% endif %}">
          <span class="material-icons-round nav-icon">groups</span>
          <span class="nav-label">Account Teams</span>
        </a>
      </li>
      <li>
        <a href="/meetings" title="Meetings"
           class="nav-link {% if request.path.startswith('/meetings') %}active{% endif %}">
          <span class="material-icons-round nav-icon">calendar_today</span>
          <span class="nav-label">Meetings</span>
        </a>
      </li>
      <li>
        <a href="/sanitize" title="Redact Notes"
           class="nav-link {% if request.path.startswith('/sanitize') %}active{% endif %}">
          <span class="material-icons-round nav-icon">security</span>
          <span class="nav-label">Redact</span>
        </a>
      </li>
    </ul>
  </nav>
  <main class="main-content" id="mainContent">
    {% block content %}{% endblock %}
  </main>

  <!-- Modal backdrop (shared) -->
  <div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this)closeModal()"></div>

  <!-- Confirm delete modal (shared) -->
  <div class="modal" id="confirmModal">
    <div class="modal-title">Confirm Delete</div>
    <p id="confirmModalMessage" style="color:var(--text-muted);margin-bottom:8px"></p>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" id="confirmModalOk">Delete</button>
    </div>
  </div>

  <!-- Team Member Modal (shared by company page + account teams page) -->
  <div class="modal" id="teamMemberModal">
    <div class="modal-title" id="teamMemberModalTitle">Add Team Member</div>
    <form id="teamMemberForm" onsubmit="submitTeamMember(event)">
      <input type="hidden" id="tmId">
      <input type="hidden" id="tmCompanyId">
      <div class="form-row">
        <label>Role *</label>
        <select id="tmRole" onchange="toggleTeamTitle()">
          <option value="account_executive">Account Executive</option>
          <option value="customer_service_manager">Customer Service Manager</option>
          <option value="technical_account_manager">Technical Account Manager</option>
          <option value="solutions_consultant">Solutions Consultant</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="form-row" id="tmTitleRow" style="display:none">
        <label>Title *</label><input type="text" id="tmTitle">
      </div>
      <div class="form-row"><label>Name *</label><input type="text" id="tmName" required></div>
      <div class="form-row-2">
        <div class="form-row"><label>Email</label><input type="email" id="tmEmail"></div>
        <div class="form-row"><label>Phone</label><input type="text" id="tmPhone"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>

  <script src="/static/purify.min.js"></script>
  <script src="/static/marked.min.js"></script>
  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}

  <script>
    (function() {
      if (localStorage.getItem('sidebarCollapsed') === 'true') {
        document.body.classList.add('sidebar-collapsed');
      }
    })();
    function toggleSidebar() {
      document.body.classList.toggle('sidebar-collapsed');
      localStorage.setItem('sidebarCollapsed', document.body.classList.contains('sidebar-collapsed'));
    }
  </script>
</body>
</html>
