{% extends 'base.html' %}
{% block title %}Contact — TAM Debrief{% endblock %}
{% block content %}
<div id="contactDetailRoot">
  <p class="empty-state">Loading…</p>
</div>

<!-- Interactions section -->
<div id="interactionsSection" style="display:none">
  <div class="card">
    <div class="section-header">
      <div class="card-title" style="margin:0">Interactions</div>
      <button class="btn btn-primary btn-sm" onclick="openLogInteraction()">+ Log Interaction</button>
    </div>
    <div id="interactionsList"></div>
  </div>
</div>

<div class="dash-row">
  <div id="contactMeetingsSection" class="dash-col-half" style="display:none">
    <div class="card">
      <div class="card-title">Meetings</div>
      <div id="contactMeetingsList"></div>
    </div>
  </div>
  <div id="contactActionItemsSection" class="dash-col-half" style="display:none">
    <div class="card">
      <div class="card-title">Action Items</div>
      <div id="contactActionItemsList"></div>
    </div>
  </div>
</div>

<!-- Edit Contact Modal -->
<div class="modal" id="contactModal">
  <div class="modal-title" id="contactModalTitle">Edit Contact</div>
  <form id="contactForm" onsubmit="submitContactDetail(event)">
    <input type="hidden" id="contactId">
    <div class="form-row-2">
      <div class="form-row"><label>First Name *</label><input type="text" id="cfFirstName" required></div>
      <div class="form-row"><label>Last Name *</label><input type="text" id="cfLastName" required></div>
    </div>
    <div class="form-row-2">
      <div class="form-row">
        <label>Company</label>
        <select id="cfCompanyId">
          <option value="">— None —</option>
        </select>
      </div>
      <div class="form-row"><label>Title</label><input type="text" id="cfTitle"></div>
    </div>
    <div class="form-row-2">
      <div class="form-row">
        <label>Reports To</label>
        <select id="cfReportsTo">
          <option value="">— None —</option>
        </select>
      </div>
      <div class="form-row"><label>Email</label><input type="email" id="cfEmail"></div>
    </div>
    <div class="form-row-2">
      <div class="form-row"><label>Phone</label><input type="tel" id="cfPhone"></div>
    </div>
    <div class="form-row"><label>Notes</label><textarea id="cfNotes"></textarea></div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</div>

<!-- Log Interaction Modal -->
<div class="modal" id="interactionModal">
  <div class="modal-title" id="interactionModalTitle">Log Interaction</div>
  <form id="interactionForm" onsubmit="submitInteraction(event)">
    <input type="hidden" id="iId">
    <div class="form-row-2">
      <div class="form-row">
        <label>Type</label>
        <select id="iType">
          <option value="call">Call</option>
          <option value="email">Email</option>
          <option value="meeting">Meeting</option>
          <option value="note">Note</option>
        </select>
      </div>
      <div class="form-row">
        <label>Date</label>
        <input type="date" id="iDate" required>
      </div>
    </div>
    <div class="form-row">
      <label>Summary *</label>
      <textarea id="iSummary" required placeholder="What happened?"></textarea>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</div>
{% endblock %}
{% block scripts %}
<script>
  initContactDetail({{ contact_id }});
  document.getElementById('interactionsSection').style.display = '';
  document.getElementById('contactMeetingsSection').style.display = '';
  document.getElementById('contactActionItemsSection').style.display = '';
</script>
{% endblock %}
